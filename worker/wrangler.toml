# Deploy from this folder:  npx wrangler deploy
# Database changes:         npx wrangler d1 execute pms --remote --file schema.sql
name = "pms-api"
main = "worker.js"
compatibility_date = "2026-09-01"
# keep variables that were set in the Cloudflare dashboard
keep_vars = true
# served at https://pms-api.<subdomain>.workers.dev; no extra per-version preview addresses
workers_dev = true
preview_urls = false

# Live flight status (Flightradar24): every 30 minutes (the user's choice, 2026-10-16); the Worker looks up only
# when due and within the credit budget (see worker.js)
[triggers]
crons = ["*/30 * * * *"]

# Hourly database backups: compressed exports kept here (worker.js "hourly backups"; created with `wrangler kv namespace create pms-backups`)
[[kv_namespaces]]
binding = "BACKUPS"
id = "48710e49e880465987b706a98f70096e"

[vars]
# Sites allowed to call the API (localhost is always allowed, for testing)
ALLOWED_ORIGINS = "https://pms.raajsoftware.com,https://faizehashemi.github.io"
# Flightradar24 API: credits in the plan each month, and the share kept in reserve (never used by the PMS)
FR24_MONTHLY_CREDITS = "60000"
FR24_RESERVE = "0.25"
# VariFlight (airline schedule / status): credits a month the PMS may use (1 credit = ¥0.01; a look-up = 50) and the
# share never used. 5000 = the ¥50 trial — raise it after topping up.
VF_MONTHLY_CREDITS = "5000"
VF_RESERVE = "0.2"

[[d1_databases]]
binding = "DB"
# Western Europe since 21 Oct 2026 (Saudi desks reach Cloudflare in Marseille / Milan: ~32 ms a round trip instead of
# ~325 ms to the old Sydney database "pms" 588fe34b-73a2-4c07-83dd-46e5da3fad30, kept unchanged as the way back).
database_name = "pms-weur"
database_id = "e1514322-3dae-4fd9-abff-bbee6bf375e3"

# Workers AI — the read-only ✨ assistant in the top bar (worker.js "AI: assistant + fixes")
[ai]
binding = "AI"
