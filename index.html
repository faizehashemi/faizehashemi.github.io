<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c56321">
    <title>Mohammedi Makan Bot</title>
<style>
:root {
    --brand: #c56321;
    --brand-strong: #a84312;
    --brand-soft: #fbeee4;
    --on-brand: #ffffff;
    --bg: #f6f3f0;
    --surface: #ffffff;
    --text: #1f1a17;
    --muted: #6b625c;
    --line: #e6ded7;
    --danger: #b3261e;
    --danger-soft: #fdecea;
    --ok: #1e7b45;
    --ok-soft: #e6f4ec;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
    :root {
        --brand: #e07a35;
        --brand-strong: #f08c47;
        --brand-soft: #3a2619;
        --on-brand: #1a0f08;
        --bg: #141210;
        --surface: #1f1c19;
        --text: #f3eee9;
        --muted: #b0a69e;
        --line: #36302b;
        --danger: #ff8a80;
        --danger-soft: #3b1f1d;
        --ok: #7fd3a0;
        --ok-soft: #1a3325;
        --shadow: none;
    }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Header */
.app-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--brand);
    color: var(--on-brand);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 12px;
}
.app-header .back {
    width: 44px; height: 44px; margin-left: -10px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: inherit;
}
.app-header .back:active { background: rgba(255,255,255,.18); }
.app-header .back svg { width: 24px; height: 24px; }
.app-header h1 { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-chip {
    flex-shrink: 0; max-width: 45%;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.2);
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Progress */
.steps {
    display: flex; gap: 6px;
    padding: 12px 16px 0;
    max-width: 640px; width: 100%; margin: 0 auto;
}
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
.steps span.on { background: var(--brand); }
.step-label { padding: 6px 16px 0; max-width: 640px; width: 100%; margin: 0 auto; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }

main {
    flex: 1;
    width: 100%; max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
}
.view { display: flex; flex-direction: column; gap: 16px; animation: in .18s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.welcome { background: var(--brand-soft); border-color: transparent; }
.welcome strong { display: block; font-size: 20px; margin-bottom: 4px; overflow-wrap: anywhere; }
.welcome p { color: var(--text); }
h2 { font-size: 22px; line-height: 1.25; }
.hint { color: var(--muted); font-size: 15px; margin-top: -8px; }

/* Building tiles */
.tiles { display: grid; gap: 12px; }
.tile {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 72px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: left;
    transition: transform .1s, border-color .15s;
}
.tile:active { transform: scale(.985); border-color: var(--brand); }
.tile .icon {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 12px; background: var(--brand-soft); color: var(--brand);
    display: grid; place-items: center;
}
.tile .icon svg { width: 24px; height: 24px; }
.tile .name { flex: 1; font-size: 18px; font-weight: 650; }
.tile .sub { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
.tile .chev { color: var(--muted); width: 20px; height: 20px; }

/* Floor chips */
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 480px) { .chips { grid-template-columns: repeat(4, 1fr); } }
.chip {
    min-height: 56px; padding: 8px 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 16px; font-weight: 600;
    transition: transform .1s, background .15s;
}
.chip:active { transform: scale(.96); background: var(--brand-soft); border-color: var(--brand); }

/* Details */
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 40px; padding: 6px 12px;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-size: 15px; font-weight: 600;
}
.pill .edit { color: var(--brand); font-weight: 600; font-size: 14px; }
.field-label { font-weight: 650; font-size: 16px; display: block; margin-bottom: 8px; }
textarea {
    width: 100%; min-height: 128px; resize: vertical;
    padding: 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
    font: inherit; font-size: 17px; /* ≥16px stops iOS zoom */
}
textarea::placeholder { color: var(--muted); }
textarea.invalid { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: 14px; margin-top: 6px; font-weight: 600; }

.photo-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 12px 16px;
    border-radius: 12px; font-weight: 650; font-size: 16px;
    transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.btn-outline { border: 1.5px solid var(--brand); color: var(--brand); background: var(--surface); }
.btn-primary { background: var(--brand); color: var(--on-brand); width: 100%; min-height: 56px; font-size: 18px; }
.btn-primary[disabled] { opacity: .65; }
.btn-ghost { color: var(--brand); width: 100%; }

.preview { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.preview img { display: block; width: 100%; max-height: 320px; object-fit: contain; }
.preview .remove {
    position: absolute; top: 8px; right: 8px;
    min-height: 40px; padding: 6px 14px; border-radius: 999px;
    background: rgba(0,0,0,.65); color: #fff; font-size: 14px; font-weight: 600;
}

.sticky-send {
    position: sticky; bottom: 0;
    margin: 0 -16px calc(-24px - env(safe-area-inset-bottom));
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
}

#errorBox .alert { margin-bottom: 10px; }
.alert { border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; }
.alert-error { background: var(--danger-soft); color: var(--danger); }
.alert-note { background: var(--brand-soft); color: var(--text); font-weight: 500; }

.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Done */
.done { text-align: center; align-items: center; padding-top: 24px; }
.done .badge { width: 80px; height: 80px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.done .badge svg { width: 44px; height: 44px; }
.done p { color: var(--muted); max-width: 34ch; }
.done .card { width: 100%; text-align: left; }
.recap { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; }
.recap dt { color: var(--muted); }
.recap dd { font-weight: 600; overflow-wrap: anywhere; }

.empty { text-align: center; align-items: center; padding-top: 32px; }
.empty .badge { width: 72px; height: 72px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.empty .badge svg { width: 36px; height: 36px; }
.empty p { color: var(--muted); max-width: 34ch; }
</style>
</head>
<body>

<header class="app-header">

<div class="steps" id="steps" hidden aria-hidden="true"><span></span><span></span><span></span></div>

<main id="app" aria-live="polite"></main>

<script>

// ---------- State ----------
const state = {
    room: new URLSearchParams(window.location.search).get('room') || "",
    flattery: flatteryList[Math.floor(Math.random() * flatteryList.length)],
    building: "",
    floor: "",
    query: "",
    image: null,        // File
    imageUrl: null,     // preview URL
    sending: false,
    error: "",
    photoWarning: false,
    step: 0             // 0 building · 1 floor · 2 details · 3 done
};

// ---------- Helpers ----------
const $app = document.getElementById('app');
const icons = {
    building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M8 7h4M8 11h4M8 15h4M3 21h18"/></svg>',

    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>'
};
function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- Navigation (phone back button goes back a step) ----------
function go(step, push = true) {
    state.step = step;
    state.error = "";
    if (push) history.pushState({ step }, "");
    render();
    window.scrollTo(0, 0);
}
window.addEventListener('popstate', (e) => {
    if (state.sending) { history.pushState({ step: state.step }, ""); return; }
    const step = e.state && typeof e.state.step === 'number' ? e.state.step : 0;
    // after sending, Back starts a new report instead of reopening the sent one
    if (state.step === 3) { resetReport(); go(0, false); return; }
    go(step, false);
});
document.getElementById('backBtn').onclick = () => history.back();

function resetReport() {
    if (state.imageUrl) URL.revokeObjectURL(state.imageUrl);
    Object.assign(state, { building: "", floor: "", query: "", image: null, imageUrl: null, error: "", photoWarning: false });
}

// ---------- Rendering ----------
function renderChrome() {
    const chip = document.getElementById('roomChip');
    chip.hidden = !state.room;
    chip.textContent = state.room;
    chip.title = state.room;

    const inFlow = state.room && state.step <= 2;
    document.getElementById('backBtn').hidden = !(state.room && state.step >= 1 && state.step <= 2);
    const steps = document.getElementById('steps');
    const label = document.getElementById('stepLabel');
    steps.hidden = label.hidden = !inFlow;
    [...steps.children].forEach((s, i) => s.classList.toggle('on', i <= state.step));
    label.textContent = `Step ${state.step + 1} of 3 · ` + ["Building", "Issue", "Details"][state.step];
}

function render() {
    renderChrome();
    if (!state.room) return renderNoRoom();
    [renderBuildings, renderFloors, renderDetails, renderDone][state.step]();
}

function renderNoRoom() {
    $app.innerHTML = `
        <section class="view empty">
            <div class="badge">${icons.link}</div>
            <h2>Open your personal link</h2>
            <p>This page needs your name in the link (for example <b>…/index.html?room=YourName</b>). Please open the link you were given.</p>
        </section>`;
}

function renderBuildings() {
    $app.innerHTML = `
        <section class="view">
            <div class="card welcome">
                <strong>Welcome ${esc(state.room)}.</strong>
                <p>${esc(state.flattery)} How can I assist you?</p>
            </div>
            <h2>Which building?</h2>
            <div class="tiles">
                ${Object.keys(BUILDINGS).map(b => `
                    <button class="tile" type="button" data-building="${esc(b)}">
                        <span class="icon">${icons.building}</span>
                        <span class="name">${esc(b)}<span class="sub">${BUILDINGS[b].length} floors</span></span>
                        ${icons.chev}
                    </button>`).join('')}
            </div>
        </section>`;
    $app.querySelectorAll('[data-building]').forEach(btn => btn.onclick = () => {
        state.building = btn.dataset.building;
        state.floor = "";
        go(1);
    });
}

function renderFloors() {
    const floors = BUILDINGS[state.building] || [];
    $app.innerHTML = `
        <section class="view">
            <h2>Please select the issue for ${esc(state.building)}</h2>
            <p class="hint">Choose the floor where the problem is.</p>
            <div class="chips">
                ${floors.map(f => `<button class="chip" type="button" data-floor="${esc(f)}">${esc(f.replace(/ Floor$/, ''))}</button>`).join('')}
            </div>
        </section>`;
    $app.querySelectorAll('[data-floor]').forEach(btn => {
        btn.setAttribute('aria-label', btn.dataset.floor);
        btn.onclick = () => { state.floor = btn.dataset.floor; go(2); };
    });
}

function renderDetails() {
    $app.innerHTML = `
        <section class="view">
            <div class="summary">
                <button class="pill" type="button" data-jump="0">${esc(state.building)} <span class="edit">Change</span></button>
                <button class="pill" type="button" data-jump="1">${esc(state.floor)} <span class="edit">Change</span></button>
            </div>

            <div>
                <label class="field-label" for="userQuery">What is the problem?</label>
                <textarea id="userQuery" placeholder="Type your query related to “${esc(state.floor)}” for ${esc(state.room)}…" maxlength="3000">${esc(state.query)}</textarea>
                <div class="field-error" id="queryError" hidden>Please enter a valid query.</div>
            </div>

            <div>
                <div class="field-label">Photo <span style="color:var(--muted);font-weight:500">(optional)</span></div>
                <div id="photoBox"></div>
            </div>

            <div class="sticky-send">
                <div id="errorBox"></div>
                <button class="btn btn-primary" id="sendBtn" type="button">${icons.send}<span>Send Query</span></button>
            </div>
        </section>`;

    const ta = document.getElementById('userQuery');
    ta.addEventListener('input', () => {
        state.query = ta.value;
        if (ta.value.trim()) { ta.classList.remove('invalid'); document.getElementById('queryError').hidden = true; }
    });
    $app.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
        const target = Number(b.dataset.jump);
        history.go(target - state.step);
    });
    document.getElementById('sendBtn').onclick = submitQuery;
    renderPhoto();
    renderError();
}

function renderPhoto() {
    const box = document.getElementById('photoBox');
    if (!box) return;
    if (state.imageUrl) {
        box.innerHTML = `
            <div class="preview">
                <img src="${state.imageUrl}" alt="Attached photo">
                <button class="remove" type="button" id="removePhoto">Remove</button>
            </div>`;
        document.getElementById('removePhoto').onclick = () => {
            URL.revokeObjectURL(state.imageUrl);
            state.image = null; state.imageUrl = null;
            renderPhoto();
        };
    } else {
        box.innerHTML = `
            <div class="photo-actions">
                <button class="btn btn-outline" type="button" id="capturePhoto">${icons.camera}<span>Capture Photo</span></button>
                <button class="btn btn-outline" type="button" id="uploadImage">${icons.gallery}<span>Upload Image</span></button>
            </div>`;
        document.getElementById('capturePhoto').onclick = () => pickImage(true);
        document.getElementById('uploadImage').onclick = () => pickImage(false);
    }
}

function renderError() {
    const box = document.getElementById('errorBox');
    if (!box) return;
    box.innerHTML = state.error ? `<div class="alert alert-error" role="alert">${esc(state.error)}</div>` : '';
}

function renderDone() {
    $app.innerHTML = `
        <section class="view done">
            <div class="badge">${icons.check}</div>
            <h2>Sent to the team</h2>
            <p>Thank you for your query. We have forwarded your issue and query to the relevant team.</p>
            ${state.photoWarning ? `<div class="alert alert-note" style="width:100%">Your message was delivered, but the photo could not be attached.</div>` : ''}
            <div class="card">
                <dl class="recap">
                    <dt>Building</dt><dd>${esc(state.building)}</dd>
                    <dt>Issue</dt><dd>${esc(state.floor)}</dd>
                    <dt>Name</dt><dd>${esc(state.room)}</dd>
                    <dt>Query</dt><dd>${esc(state.query)}</dd>
                    ${state.image ? `<dt>Photo</dt><dd>${state.photoWarning ? 'Not sent' : 'Attached'}</dd>` : ''}
                </dl>
            </div>
            <button class="btn btn-primary" type="button" id="againBtn">Report another issue</button>
        </section>`;
    document.getElementById('againBtn').onclick = () => { resetReport(); go(0); };
}

// ---------- Photo (Capture Photo / Upload Image) ----------
function pickImage(capture) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    if (capture) input.capture = 'environment';
    input.style.display = 'none';
    input.onchange = () => {
        const file = input.files && input.files[0];
        input.remove();
        if (!file) return;
        if (state.imageUrl) URL.revokeObjectURL(state.imageUrl);
        state.image = file;
        state.imageUrl = URL.createObjectURL(file);
        renderPhoto();
    };
    document.body.appendChild(input);
    input.click();
}

// Phone photos are often 5–10 MB: shrink to ≤2048px JPEG so they upload fast. Falls back to the original file.
async function shrinkImage(file) {
    try {
        if (file.size < 1.5 * 1024 * 1024 && file.type === 'image/jpeg') return file;
        const img = await new Promise((resolve, reject) => {
            const i = new Image();
            i.onload = () => resolve(i);
            i.onerror = reject;
            i.src = URL.createObjectURL(file);
        });
        const scale = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
        if (!blob) return file;
        return new File([blob], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch {
        return file;
    }
}

// ---------- Send ----------
async function submitQuery() {
    const ta = document.getElementById('userQuery');
    const userQuery = ta.value;
    if (!userQuery.trim()) {
        ta.classList.add('invalid');
        document.getElementById('queryError').hidden = false;
        ta.focus();
        return;
    }
    if (!state.room || !state.floor) {
        state.error = "Room number or issue type is missing!";
        return renderError();
    }
    if (state.sending) return;

    state.query = userQuery;
    state.sending = true;
    state.error = "";
    state.photoWarning = false;
    renderError();
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span><span>${state.image ? 'Sending photo…' : 'Sending…'}</span>`;

    try {
        await forwardToTelegramWithQuery(state.room, state.building, state.floor, userQuery, state.image);
        state.sending = false;
        go(3);
    } catch (error) {
        console.error("Telegram Error:", error);
        state.sending = false;
        state.error = "Could not send. Please check your internet connection and try again.";
        btn.disabled = false;
        btn.innerHTML = `${icons.send}<span>Try again</span>`;
        renderError();
    }
}

// Same Telegram message as before; the Worker sends it with the photo (sendPhoto + caption) or as text (sendMessage).
async function forwardToTelegramWithQuery(room, building, floor, query, image) {
    const message = `🔔 *${building}* 🔔\n\n`
                + `📌 *Issue*: ${floor}\n`
                + `🏨 *Username*: ${room}\n`
                + `💬 *User Query*: ${query}\n\n`
                + `📩 *Please assist as soon as possible!*`;

    const sendText = async () => {
        const response = await fetch(NOTIFY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: message })
        });
        const data = await response.json().catch(() => ({}));
        console.log("Telegram Message Sent:", data);
        if (!response.ok || !data.ok) throw new Error(`Message send failed: ${data.telegram || data.error || response.status}`);
    };

    if (!image) return sendText();

    try {
        const formData = new FormData();
        formData.append('text', message);
        formData.append('photo', await shrinkImage(image));
        const imageResponse = await fetch(NOTIFY_URL, { method: 'POST', body: formData });
        const imageData = await imageResponse.json().catch(() => ({}));
        console.log("Telegram Image Sent:", imageData);
        if (!imageResponse.ok || !imageData.ok) throw new Error(`Image send failed: ${imageData.telegram || imageData.error || imageResponse.status}`);
    } catch (error) {
        // Photo failed: still deliver the request as text so the team gets it
        console.error("Telegram Error:", error);
        await sendText();
        state.photoWarning = true;
    }
}

// ---------- Start ----------
history.replaceState({ step: 0 }, "");
render();
</script>
