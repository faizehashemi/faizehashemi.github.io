<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Transport Signage</title>
    <!-- The signage moved to /<site>/signage (public, no login). Old bookmarks land there. -->
    <script>
        (function () {
            var site = new URLSearchParams(location.search).get('site');
            location.replace('../' + (site === 'medina' ? 'medina' : 'makkah') + '/signage');
        })();
    </script>
</head>
<body></body>
</html>
