<div class="hk">
    <header class="hk-head">
        <div>
            <h1>Room cleaning</h1>
        </div>
        <div class="hk-controls">
            <label>Day<input type="date" id="hkDay"></label>
            <label>Building<select id="hkBld"><option value="">Choose a building…</option></select></label>
            <div class="hk-chips"><button type="button" data-day="-1">Yesterday</button><button type="button" data-day="0">Today</button><button type="button" data-day="1">Tomorrow</button></div>
            <button type="button" class="hk-btn" id="hkPrint">🖨 Print</button>
        </div>
    </header>

    <section class="hk-kpis" id="hkKpis"></section>

    <section class="hk-card">
        <div class="hk-card-head">
            <h2>Priority list</h2>
            <label class="hk-hide"><input type="checkbox" id="hkHideDone"> hide rooms marked done</label>
        </div>
        <div class="hk-scroll" id="hkList"></div>
    </section>
</div>
