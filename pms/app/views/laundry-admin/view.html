<div class="la">
    <header class="la-head">
        <h1>🧺 Laundry admin</h1>
        <span class="la-sub" id="laSub"></span>
    </header>
    <nav class="la-tabs" role="tablist" aria-label="Laundry admin">
        <button type="button" data-tab="bills" aria-selected="true">🧾 Bills</button>
        <button type="button" data-tab="payments">💰 Payments</button>
        <button type="button" data-tab="reports">📈 Reports</button>
        <button type="button" data-tab="free">👷 Staff only</button>
        <button type="button" data-tab="building">🏨 Building</button>
        <button type="button" data-tab="prices">🏷️ Prices</button>
        <button type="button" data-tab="staff">👤 Staff</button>
        <button type="button" data-tab="notice">📝 Notice &amp; log</button>
    </nav>

    <!-- BILLS: cash bills only, from → to; mark them paid one by one, by selection, or by the amount collected -->
    <section class="la-pane" id="tab-bills">
        <div class="la-filters">
            <label>From <input type="date" id="bFrom"></label>
            <label>To <input type="date" id="bTo"></label>
        </div>
        <div id="bBody"></div>
    </section>

    <!-- PAYMENTS: the log of every "mark paid" / "mark unpaid" — who, when, which bills, how much -->
    <section class="la-pane" id="tab-payments" hidden>
        <div class="la-range" data-range="payments"></div>
        <div id="payBody"></div>
    </section>

    <section class="la-pane" id="tab-reports" hidden>
        <div class="la-range" data-range="reports"></div>
        <div id="repBody"></div>
    </section>

    <!-- BUILDING: the building's linen sent from the laundry screen (Building tab) — no money -->
    <section class="la-pane" id="tab-building" hidden>
        <div class="la-range" data-range="building"></div>
        <div id="bldBody"></div>
    </section>

    <section class="la-pane" id="tab-free" hidden>
        <div class="la-range" data-range="free"></div>
        <div id="freeBody"></div>
    </section>

    <section class="la-pane" id="tab-prices" hidden>
        <div class="la-bar"><p class="la-muted">New prices apply to new bills only; old bills keep the price they were billed at.</p><button type="button" class="la-primary" id="addItem" data-admin>➕ Add item</button></div>
        <div id="priceBody"></div>
    </section>

    <section class="la-pane" id="tab-staff" hidden>
        <div class="la-card la-cats">
            <h3>🗂️ Staff categories <small class="la-muted">— the laundry screen shows these first; staff without one are under "Uncategorized"</small></h3>
            <div class="la-catlist" id="catList"></div>
            <div class="la-bar" data-admin><input id="catNew" maxlength="40" placeholder="New category, e.g. Kitchen"><button type="button" class="la-primary" id="catAdd">➕ Add category</button></div>
        </div>
        <div class="la-bar"><input type="search" id="sQ" placeholder="🔎 Name, staff ID, room, mobile"><select id="sCat" aria-label="Category"><option value="*">All categories</option></select><button type="button" class="la-primary" id="addStaff" data-admin>➕ Add staff</button></div>
        <div id="staffBody"></div>
    </section>

    <section class="la-pane" id="tab-notice" hidden>
        <div class="la-card">
            <h2>Notice for the laundry screen and receipts</h2>
            <textarea id="nText" rows="4" maxlength="600"></textarea>
            <div class="la-bar"><span class="la-muted" id="nMsg"></span><button type="button" class="la-primary" id="nSave" data-admin>Save notice</button></div>
        </div>
        <div class="la-card">
            <h2>Laundry change log</h2>
            <div id="logBody"></div>
        </div>
    </section>
</div>
