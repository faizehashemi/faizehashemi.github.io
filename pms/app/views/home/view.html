<div class="hm">
    <header class="hm-hero">
        <div class="hm-hello">
            <p class="hm-greet" id="hmGreet">Assalaamo Alaikum</p>
            <h1 id="hmName">Welcome</h1>
            <p class="hm-praise" id="hmPraise"></p>
        </div>
        <div class="hm-dates">
            <button type="button" class="hm-hijri" id="hmHijri" title="Open the calendar">—</button>
            <div class="hm-greg" id="hmGreg">—</div>
            <div class="hm-today-miqaat" id="hmTodayMiqaat"></div>
        </div>
    </header>

    <section class="hm-section" aria-labelledby="hmTodayTitle">
        <div class="hm-head">
            <h2 id="hmTodayTitle">Today at a glance</h2>
            <span class="hm-sub" id="hmTodaySub"></span>
        </div>
        <div class="hm-stats">
            <a class="hm-stat in" id="stIn" href="#"><span class="hm-ico" aria-hidden="true">🛬</span><b>—</b><span class="hm-lbl">Check-ins today</span><small></small></a>
            <a class="hm-stat out" id="stOut" href="#"><span class="hm-ico" aria-hidden="true">🧳</span><b>—</b><span class="hm-lbl">Check-outs today</span><small></small></a>
            <button type="button" class="hm-stat mk" id="stMakkah" title="See every group staying in Makkah now"><span class="hm-ico" aria-hidden="true">🕋</span><b>—</b><span class="hm-lbl">Currently in Makkah</span><small></small></button>
            <button type="button" class="hm-stat md" id="stMadina" title="See every group staying in Madina now"><span class="hm-ico" aria-hidden="true">🕌</span><b>—</b><span class="hm-lbl">Currently in Madina</span><small></small></button>
        </div>
    </section>

    <section class="hm-section" aria-labelledby="hmMealsTitle">
        <div class="hm-head">
            <h2 id="hmMealsTitle">Thaals today</h2>
            <a class="hm-more" id="hmMealsLink" href="#">Open Mawaid →</a>
        </div>
        <div class="hm-stats meals">
            <div class="hm-stat b" id="mlB"><span class="hm-ico" aria-hidden="true">🌅</span><b>—</b><span class="hm-lbl">Breakfast thaals</span><small></small></div>
            <div class="hm-stat l" id="mlL"><span class="hm-ico" aria-hidden="true">☀️</span><b>—</b><span class="hm-lbl">Lunch thaals</span><small></small></div>
            <div class="hm-stat d" id="mlD"><span class="hm-ico" aria-hidden="true">🌙</span><b>—</b><span class="hm-lbl">Dinner thaals</span><small></small></div>
        </div>
    </section>

    <div class="hm-grid">
        <section class="hm-card hm-weather" aria-labelledby="hmWxTitle">
            <h2 id="hmWxTitle">Weather</h2>
            <div class="hm-wx" id="hmWx"><p class="hm-muted">Loading…</p></div>
        </section>

        <section class="hm-card hm-namaz" aria-labelledby="hmNzTitle">
            <h2 id="hmNzTitle">Namaz timings</h2>
            <div id="hmNz"><p class="hm-muted">Loading…</p></div>
        </section>

        <section class="hm-card hm-miqaat" aria-labelledby="hmMqTitle">
            <div class="hm-card-head"><h2 id="hmMqTitle">Miqaats</h2><button type="button" class="hm-cal-btn" id="hmOpenCal">📅 Calendar</button></div>
            <div id="hmMq"><p class="hm-muted">Loading…</p></div>
        </section>

    </div>
</div>
