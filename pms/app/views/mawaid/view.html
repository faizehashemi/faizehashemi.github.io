<div class="wrap">
        <header class="hero panel">
            <h1>Mawaid Counts</h1>
            <p class="muted small" id="heroInfo"></p>
        </header>

        <section class="panel">
            <div class="controls">
                <div class="col c3">
                    <label for="statDate">Select date</label>
                    <input id="statDate" type="date" />
                </div>

                <!-- Breakfast range -->
                <div class="col c2">
                    <label for="timeBStart">Breakfast start</label>
                    <input id="timeBStart" type="time" value="04:00" />
                </div>
                <div class="col c2">
                    <label for="timeBEnd">Breakfast end</label>
                    <input id="timeBEnd" type="time" value="09:30" />
                </div>

                <!-- Lunch range -->
                <div class="col c2">
                    <label for="timeLStart">Lunch start</label>
                    <input id="timeLStart" type="time" value="11:00" />
                </div>
                <div class="col c2">
                    <label for="timeLEnd">Lunch end</label>
                    <input id="timeLEnd" type="time" value="16:00" />
                </div>

                <!-- Dinner range -->
                <div class="col c2">
                    <label for="timeDStart">Dinner start</label>
                    <input id="timeDStart" type="time" value="18:00" />
                </div>
                <div class="col c2">
                    <label for="timeDEnd">Dinner end</label>
                    <input id="timeDEnd" type="time" value="23:00" />
                </div>

                <div class="col c2">
                    <label for="thalSize">Thal size</label>
                    <input id="thalSize" type="number" min="1" step="1" value="8" />
                </div>

                <!-- Inclusion toggles (affect total Pax only) -->
                <div class="col c4">
                    <label>Include in Pax totals</label>
                    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                        <label class="small"><input id="incAdults" type="checkbox" checked /> Adults</label>
                        <label class="small"><input id="incChildren" type="checkbox"  /> Children</label>
                        <label class="small"><input id="incInfants" type="checkbox"  /> Infants</label>
                    </div>
                </div>

                <!-- Manda multipliers -->
                <div class="col c3">
                    <label for="multL">Manda: Lunch thal ×</label>
                    <input id="multL" type="number" step="0.1" value="3" />
                </div>
                <div class="col c3">
                    <label for="multD">Manda: Dinner thal ×</label>
                    <input id="multD" type="number" step="0.1" value="2.5" />
                </div>

                <!-- Visibility toggles (default ON) -->
                <div class="col c4">
                    <label>Show breakdown columns</label>
                    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                        <label class="small"><input id="showPax" type="checkbox" /> Pax</label>
                        <label class="small"><input id="showG" type="checkbox" /> Gents</label>
                        <label class="small"><input id="showL" type="checkbox" /> Ladies</label>
                        <label class="small"><input id="showC" type="checkbox" /> Children</label>
                        <label class="small"><input id="showI" type="checkbox" /> Infants</label>
                    </div>
                </div>




                <div class="col c2">
                    <label>&nbsp;</label>
                    <button id="btnRefresh" class="btn-gold no-print">Refresh data</button>
                </div>
                <div class="col c2">
                    <label>&nbsp;</label>
                    <button id="btnRun" class="no-print" hidden>Run</button>
                </div>
                <div class="col c2">
                    <label>&nbsp;</label>
                    <button id="btnPrint" class="no-print">Print</button>
                </div>
                <div class="col c2">
                    <label>&nbsp;</label>
                    <button id="btnCSV" class="no-print">Export CSV</button>
                </div>
            </div>

            <div class="table-wrap">
                <table id="tbl">
                    <thead></thead>
                    <tbody></tbody>
                    <tfoot></tfoot>
                </table>
            </div>

        </section>
        <!-- Cooking Count -->
        <section class="panel" style="margin-top:12px">
            <div style="padding:10px 12px;border-bottom:1px solid var(--border)">
                <strong>Cooking Count</strong>
                <span class="muted small"> • HUSN+BAHA merged. Lunch & Dinner also merge MUFADDAL+MOHAMMEDI.</span>
            </div>
            <div class="table-wrap">
                <table id="tblCook">
                    <thead></thead>
                    <tbody></tbody>
                    <tfoot></tfoot>
                </table>
            </div>
        </section>

        <!-- Manda Counts -->
        <section class="panel" style="margin-top:12px">
            <div style="padding:10px 12px;border-bottom:1px solid var(--border)">
                <strong>Manda Counts</strong>
                <span class="muted small"> • Only Lunch & Dinner thals. Multipliers applied.</span>
            </div>
            <div class="table-wrap">
                <table id="tblManda">
                    <thead></thead>
                    <tbody></tbody>
                    <tfoot></tfoot>
                </table>
            </div>
        </section>


        <p id="status" class="muted" style="margin-top:10px"></p>
    </div>
