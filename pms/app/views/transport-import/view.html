<div class="tp">
    <header class="tp-head">
        <div>
            <h1>Transport import</h1>
            <p class="tp-sub">Paste the transport list (with or without its heading row). Days that are already saved are compared first — you choose which changes to apply.</p>
        </div>
        <div class="tp-actions">
            <a class="tp-btn" id="tiDay" href="#">🚌 Transport day</a>
        </div>
    </header>
    <section class="tp-card">
        <h2>Paste the list</h2>
        <textarea id="tiText" class="ti-text" spellcheck="false" placeholder="Booking Ref	Dora No	Vch No	Transporter	Date	Tour Operator	Gr Leader	Source-Destination	Pax Count	Total Pax	Rooms Allocated	Remarks	User Loc"></textarea>
        <div class="tp-bar ti-go">
            <button type="button" class="tp-btn gold" id="tiRead">Read the list</button>
            <button type="button" class="tp-btn" id="tiClear">Clear</button>
            <span class="tp-muted" id="tiStatus"></span>
        </div>
    </section>
    <div id="tiResult"></div>
</div>
