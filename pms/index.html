<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9ec" />
    <!-- the PMS has its own light look and its own Night mode (Settings): browsers' automatic dark mode must not recolour it (it turned buttons white and text pale) -->
    <meta name="color-scheme" content="only light" />
    <title>PMS</title>
    <script>
        // The PMS lives at pms.raajsoftware.com. The old GitHub address forwards there, keeping the page
        // (#/makkah/slip?sh_no=…) — unless this browser still holds laundry bills saved offline here, which
        // must be sent from this address first (they are kept per address).
        (function () {
            if (location.hostname !== 'faizehashemi.github.io') return;
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k.indexOf('pms_laundry_queue:') === 0 && JSON.parse(localStorage.getItem(k) || '[]').length) return;
                }
            } catch (e) { }
            location.replace('https://pms.raajsoftware.com/' + location.search + location.hash);
        })();
    </script>
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        /* Shell only. Every view brings its own stylesheet (app/views/<id>/view.css). */
        #view[aria-busy="true"] { min-height: 60vh; }
        /* the footer starts below the screen and stays there while a page fills in (no jump) */
        #view { min-height: calc(100vh - 60px); min-height: calc(100svh - 60px); }
        /* the page-high minimum made every print end with one empty sheet */
        @media print { #view { min-height: 0 !important; } html, body { height: auto !important; } }
        /* the gold pattern of the Home page, behind every page (a page's own stylesheet may set the same) */
        html { color-scheme: only light; }
        /* One fixed frame for the menu bar on every page: pages used to set their own body margin (Home 0, most 8px, Forecast / Slip 15px) and the bar moved
           with it, and a page too short for a scrollbar made it widen. The margin is now the page area's padding, the scrollbar space is always kept. */
        /* no scrollbars anywhere (pages still scroll by wheel, touch, keys and drag); with none shown there is no width change between short and long pages */
        html, * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; width: 0; height: 0; }
        /* the site's typeface: EB Garamond, a variable font — any weight from 400 to 800 (Rockwell Extra Bold stays a print option on the bus sheets) */
        @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond-Variable.ttf") format("truetype"); font-weight: 400 800; font-style: normal; font-display: swap; }
        @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond-Italic-Variable.ttf") format("truetype"); font-weight: 400 800; font-style: italic; font-display: swap; }
        body, input, select, textarea, button { font-family: "EB Garamond", Garamond, Georgia, serif; }
        body { font-weight: 500; font-size-adjust: 0.5; }   /* a touch heavier and larger than Garamond's small default, so text stays dark and easy to read */
        body { margin: 0 !important; }
        #view { padding: 8px; box-sizing: border-box; }
        #view[data-view="home"], #view[data-view="laundry"], #view[data-view="login"] { padding: 0; }
        #view[data-view="forecast"], #view[data-view="slip"] { padding: 15px; }
        body { background: #f7efe1 url("assets/pattern_gold_2x.png") repeat; background-size: 150px auto; }
    </style>
    <!-- after each page's own stylesheet (the router inserts those before this one) -->
    <link rel="stylesheet" href="app/core/responsive.css" id="responsive-css" data-shell>
    <!-- page loader (app/core/loader.js) -->
    <link rel="stylesheet" href="app/core/loader.css" data-shell>
    <link rel="preload" href="assets/fonts/EBGaramond-Variable.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
    <site-nav data-shell></site-nav>
    <div id="view" data-shell></div>
    <script type="module" src="app/main.js"></script>
</body>
</html>
