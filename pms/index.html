<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9ec" />
    <!-- the PMS has its own light look and its own Night mode (Settings): browsers' automatic dark mode must not recolour it (it turned buttons white and text pale) -->
    <meta name="color-scheme" content="only light" />
    <title>PMS</title>
    <script>
        // The PMS lives at pms.raajsoftware.com. The old GitHub address forwards there, keeping the page
        // (#/makkah/slip?sh_no=…) — unless this browser still holds laundry bills saved offline here, which
        // must be sent from this address first (they are kept per address).
        (function () {
            if (location.hostname !== 'faizehashemi.github.io') return;
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k.indexOf('pms_laundry_queue:') === 0 && JSON.parse(localStorage.getItem(k) || '[]').length) return;
                }
            } catch (e) { }
            location.replace('https://pms.raajsoftware.com/' + location.search + location.hash);
        })();
    </script>
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        /* Shell only. Every view brings its own stylesheet (app/views/<id>/view.css). */
        #view[aria-busy="true"] { min-height: 60vh; }
        /* the footer starts below the screen and stays there while a page fills in (no jump) */
        #view { min-height: calc(100vh - 60px); min-height: calc(100svh - 60px); }
        /* the page-high minimum made every print end with one empty sheet */
        @media print { #view { min-height: 0 !important; } html, body { height: auto !important; } }
        /* the gold pattern of the Home page, behind every page (a page's own stylesheet may set the same) */
        html { color-scheme: only light; }
        body { background: #f7efe1 url("assets/pattern_gold_2x.png") repeat; background-size: 150px auto; }
    </style>
    <!-- after each page's own stylesheet (the router inserts those before this one) -->
    <link rel="stylesheet" href="app/core/responsive.css" id="responsive-css" data-shell>
    <!-- page loader (app/core/loader.js) -->
    <link rel="stylesheet" href="app/core/loader.css" data-shell>
</head>
<body>
    <site-nav data-shell></site-nav>
    <div id="view" data-shell></div>
    <script type="module" src="app/main.js"></script>
</body>
</html>
